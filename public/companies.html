        /* ── Category color mapping ── */
        function getCategoryColor(category) {
            if (!category) return '#64748b';
            const c = category.toLowerCase();
            if (c.includes('vlsi') || c.includes('semiconductor')) return '#2563eb';
            if (c.includes('ai') || c.includes('machine learning')) return '#10b981';
            if (c.includes('software') || c.includes('eda')) return '#8b5cf6';

            if (c.includes('fintech')) return '#eab308';

        /* ── Fetch Companies ── */
        async function fetchCompanies() {
            try {
                const q = document.getElementById('q-search').value;
                const cat = document.getElementById('f-category').value;
                const country = selectedCountries.join(',');

                const res = await fetch(`/api/companies?q=${q}&category=${cat}&country=${country}`);

                if (!res.ok) {
                    console.error('API Error:', res.status, res.statusText);
                    /* ⚠️ MOCK FALLBACK — DELETE THIS BLOCK LATER */
                    if (USE_MOCK_COMPANIES) {
                        let mockData = MOCK_COMPANIES;
                        if (q) mockData = mockData.filter(c => c.name.toLowerCase().includes(q.toLowerCase()));
                        if (cat && cat !== 'All') mockData = mockData.filter(c => c.category === cat);
                        if (selectedCountries.length > 0) {
                            mockData = mockData.filter(c => {
                                const br = Array.isArray(c.branches) ? c.branches : JSON.parse(c.branches || '[]');
                                return br.some(b => selectedCountries.includes(b.country));
                            });
                        }
                        allCompaniesData = mockData;
                        document.getElementById('result-count').innerText = mockData.length;
                        renderGrid(mockData);
                    }
                    return;
                }

                const data = await res.json();
                console.log('Companies received:', data.length, data);

                /* ⚠️ MOCK FALLBACK — DELETE THIS IF BLOCK LATER */
                if (USE_MOCK_COMPANIES && (!data || data.length === 0)) {
                    let mockData = MOCK_COMPANIES;
                    const qVal = document.getElementById('q-search').value.toLowerCase();
                    const catVal = document.getElementById('f-category').value;
                    if (qVal) mockData = mockData.filter(c => c.name.toLowerCase().includes(qVal));
                    if (catVal && catVal !== 'All') mockData = mockData.filter(c => c.category === catVal);
                    if (selectedCountries.length > 0) {
                        mockData = mockData.filter(c => {
                            const br = Array.isArray(c.branches) ? c.branches : JSON.parse(c.branches || '[]');
                            return br.some(b => selectedCountries.includes(b.country));
                        });
                    }
                    allCompaniesData = mockData;
                    document.getElementById('result-count').innerText = mockData.length;
                    renderGrid(mockData);
                    return;
                }

                document.getElementById('result-count').innerText = data.length;
                allCompaniesData = data;
                renderGrid(data);

            } catch (err) {
                console.error('Fetch failed:', err);
                /* ⚠️ MOCK FALLBACK — DELETE THIS BLOCK LATER */
                if (USE_MOCK_COMPANIES) {
                    let mockData = MOCK_COMPANIES;
                    if (selectedCountries.length > 0) {
                        mockData = mockData.filter(c => {
                            const br = Array.isArray(c.branches) ? c.branches : JSON.parse(c.branches || '[]');
                            return br.some(b => selectedCountries.includes(b.country));
                        });
                    }
                    allCompaniesData = mockData;
                    document.getElementById('result-count').innerText = mockData.length;
                    renderGrid(mockData);
                }
            }
        }


        /* ── Render Grid ── */
        function renderGrid(data) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = `
                        <div class="companies-empty">
                            <i class="fas fa-building"></i>
                            <h3>No matches found</h3>
                            <p>Try adjusting your search or filters.</p>
                        </div>
                    `;
                return;
            }

            data.forEach((c, i) => {
                const branches = Array.isArray(c.branches) ? c.branches : JSON.parse(c.branches || '[]');
                c.branches = branches;
                const uniqueCountries = [...new Set(branches.map(b => b.country))];
                const localPresence = branches.find(b => selectedCountries.includes(b.country))
                    || branches.find(b => b.presence && b.presence.length > 5);

                /* Build website/linkedin URLs */
                let websiteUrl = c.website || '';
                let linkedinUrl = c.linkedin || '';
                if (websiteUrl && !websiteUrl.startsWith('http')) websiteUrl = 'https://' + websiteUrl;
                if (linkedinUrl && !linkedinUrl.startsWith('http')) linkedinUrl = 'https://' + linkedinUrl;

                const card = document.createElement('div');
                card.className = 'company-card';
                card.style.animationDelay = `${i * 0.05}s`;
                card.onclick = () => openDetail(c);
                card.innerHTML = `
                        <div class="company-card__header">
                            <div class="company-card__logo">
                                <img src="${c.logo}" alt="${c.name}"
                                    onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=random&color=fff'">
                            </div>
                            <div class="company-card__badges">
                                <span class="company-card__category">${c.category}</span>
                                ${c.size && c.size !== 'N/A'
                        ? `<span class="company-card__size"><i class="fas fa-users"></i> ${c.size}</span>`
                        : ''}
                            </div>
                        </div>

                        <h3 class="company-card__name">${c.name}</h3>
                        <p class="company-card__industry">${c.industry || ''}</p>

                        <div class="company-card__footer">
                            <div class="company-card__meta-row">
                                <div class="company-card__hq">
                                    <i class="fas fa-globe"></i> HQ: ${c.hq_country}
                                </div>
                                ${uniqueCountries.length > 0
                        ? `<span class="company-card__country-count">
                                        <i class="fas fa-earth-americas"></i> ${uniqueCountries.length} Countries
                                    </span>`
                        : ''}
                            </div>
                            <div class="company-card__branches">
                                ${uniqueCountries.slice(0, 3).map(ct =>
                            `<span class="company-card__branch-pill">${ct}</span>`
                        ).join('')}
                                ${uniqueCountries.length > 3
                        ? `<span class="company-card__branch-pill company-card__branch-pill--more">+${uniqueCountries.length - 3} more</span>`
                        : ''}
                            </div>
                            ${localPresence && localPresence.presence
                        ? `<div class="company-card__presence">
                                    <i class="fas fa-check-circle"></i> ${localPresence.presence}
                                </div>`
                        : ''}
                        </div>

                        <div class="company-card__hover-actions">
                            ${websiteUrl
                        ? `<a href="${websiteUrl}" target="_blank" class="company-card__action" onclick="event.stopPropagation()">
                                    <i class="fas fa-globe"></i> Website
                                </a>`
                        : ''}
                            ${linkedinUrl
                        ? `<a href="${linkedinUrl}" target="_blank" class="company-card__action company-card__action--linkedin" onclick="event.stopPropagation()">
                                    <i class="fab fa-linkedin"></i> LinkedIn
                                </a>`
                        : ''}
                        </div>
                    `;
                grid.appendChild(card);
            });
        }


        /* ── Client-side size filter ── */
        function applyFilters() {
            const sizeVal = document.getElementById('f-size').value;
            if (sizeVal === 'All') {
                renderGrid(allCompaniesData);
                document.getElementById('result-count').innerText = allCompaniesData.length;
                return;
            }

            /* Parse size range */
            let min = 0, max = Infinity;
            if (sizeVal === '10001+') {
                min = 10001;
            } else {
                const parts = sizeVal.split('-').map(Number);
                min = parts[0];
                max = parts[1];
            }

            /* Parse company size string to number */
            function parseSize(str) {
                if (!str || str === 'N/A') return -1;
                const cleaned = String(str).replace(/[^0-9\-+]/g, '');
                /* Handle ranges like "10001+" */
                if (cleaned.endsWith('+')) return parseInt(cleaned) || -1;
                /* Handle ranges like "201-500" */
                if (cleaned.includes('-')) {
                    const p = cleaned.split('-');
                    return (parseInt(p[0]) + parseInt(p[1])) / 2;
                }
                return parseInt(cleaned) || -1;
            }

            const filtered = allCompaniesData.filter(c => {
                const sz = parseSize(c.size);
                if (sz === -1) return false;
                return sz >= min && sz <= max;
            });

            document.getElementById('result-count').innerText = filtered.length;
            renderGrid(filtered);
        }


        /* ── Open Detail Modal ── */
        function openDetail(c) {
            const branches = Array.isArray(c.branches) ? c.branches : JSON.parse(c.branches || '[]');
            c.branches = branches;
            const grouped = {};
            branches.forEach(b => {
                const reg = b.region || 'International';
                if (!grouped[reg]) grouped[reg] = [];
                grouped[reg].push(b);
            });

            let branchesHtml = '';
            for (const [region, locs] of Object.entries(grouped)) {
                branchesHtml += `
                        <div class="companies-detail__region">
                            <div class="companies-detail__region-label">${region}</div>
                            <div class="companies-detail__region-grid">
                                ${locs.map(l => `
                                    <div class="companies-detail__loc-card">
                                        <div class="companies-detail__loc-name">
                                            ${l.state ? `<span>${l.state}, </span>` : ''}${l.country}
                                            ${l.city ? `<span class="companies-detail__loc-city">(${l.city})</span>` : ''}
                                        </div>
                                        <div class="companies-detail__loc-presence">
                                            ${l.presence || 'Presence details not listed'}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
            }

            const hasWeb = c.website && c.website.length > 3;
            const hasLi = c.linkedin && c.linkedin.length > 3;

            let webLink = c.website || '';
            if (hasWeb && !webLink.match(/^https?:\/\//i)) webLink = 'https://' + webLink;

            let liLink = c.linkedin || '';
            if (hasLi && !liLink.match(/^https?:\/\//i)) liLink = 'https://' + liLink;

            const modal = document.getElementById('modal-content-inject');
            modal.innerHTML = `
                    <div class="companies-detail__header">
                        <img src="${c.logo}" class="companies-detail__logo"
                            onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=random&color=fff'"
                            alt="${c.name}">
                        <div>
                            <h2 class="companies-detail__name">${c.name}</h2>
                            <p class="companies-detail__meta">${c.category} &bull; ${c.size || 'Size N/A'}</p>
                        </div>
                    </div>

                    <div class="companies-detail__body">
                        <div class="companies-detail__industry">
                            <strong><i class="fas fa-industry"></i> Industry Focus</strong>
                            <p>${c.industry || 'No industry details available.'}</p>
                        </div>

                        <div class="companies-detail__locations">
                            <h4><i class="fas fa-map-marked-alt"></i> Global Locations</h4>
                            ${branchesHtml}
                        </div>
                    </div>

                    <div class="companies-detail__footer">
                        ${hasWeb
                    ? `<a href="${webLink}" target="_blank" class="btn btn-primary companies-detail__link-web">
                                <i class="fas fa-globe"></i> Visit Website
                            </a>`
                    : `<button disabled class="btn companies-detail__link-disabled">
                                <i class="fas fa-globe"></i> No Website
                            </button>`
                }
                        ${hasLi
                    ? `<a href="${liLink}" target="_blank" class="btn companies-detail__link-li">
                                <i class="fab fa-linkedin"></i> LinkedIn Profile
                            </a>`
                    : `<button disabled class="btn companies-detail__link-disabled">
                                <i class="fab fa-linkedin"></i> No LinkedIn
                            </button>`
                }
                    </div>
                `;
            document.getElementById('detail-modal').style.display = 'flex';
        }


        /* ── Map Logic ── */
        function openMapModal() {
            document.body.style.overflow = 'hidden';
            document.getElementById('map-modal').style.display = 'flex';

            // Delay initialization by 100ms so the browser layout paints the modal's full height first
            setTimeout(() => {
                if (!map) {
                    const tileUrl = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
                    map = L.map('map-container').setView([20, 0], 2);
                    L.tileLayer(tileUrl, { attribution: '&copy; OSM contributors' }).addTo(map);

                    const defaultFill = '#e2e8f0';

                    fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
                        .then(r => r.json())
                        .then(data => {
                            geoLayer = L.geoJSON(data, {
                                style: {
                                    color: '#cbd5e1',
                                    weight: 1,
                                    fillColor: defaultFill,
                                    fillOpacity: 0.7
                                },
                                onEachFeature: (feature, layer) => {
                                    const name = feature.properties.name;
                                    const mapName = name === "United States of America" ? "United States" : name;

                                    layer.on('click', () => {
                                        if (selectedCountries.includes(mapName)) {
                                            selectedCountries = selectedCountries.filter(c => c !== mapName);
                                            geoLayer.resetStyle(layer);
                                        } else {
                                            selectedCountries.push(mapName);
                                            layer.setStyle({ fillColor: '#2563eb', fillOpacity: 0.9 });
                                        }
                                    });
                                }
                            }).addTo(map);

                            plotCompanyDots(allCompaniesData);
                        });

                    addMapLegend();
                }

                // Force the map to recalculate its tiles and constraints
                map.invalidateSize();
            }, 100);
        }

        function plotCompanyDots(companies) {
            dotMarkers.forEach(m => map.removeLayer(m));
            dotMarkers = [];

            companies.forEach(company => {
                const branches = Array.isArray(company.branches) ? company.branches : JSON.parse(company.branches || '[]');
                if (!branches.length) return;
                branches.forEach(branch => {
                    const coords = COUNTRY_COORDS[branch.country];
                    if (!coords) return;

                    /* Slight offset so overlapping dots spread */
                    const lat = coords[0] + (Math.random() - 0.5) * 2;
                    const lng = coords[1] + (Math.random() - 0.5) * 2;

                    const marker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: getCategoryColor(company.category),
                        color: '#ffffff',
                        weight: 2,
                        fillOpacity: 0.9
                    });

                    marker.bindPopup(`
                            <div style="font-family: 'Plus Jakarta Sans', sans-serif; min-width: 180px;">
                                <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;">${company.name}</div>
                                <div style="color: #64748b; font-size: 12px; margin-bottom: 8px;">
                                    ${branch.city ? branch.city + ', ' : ''}${branch.country}
                                </div>
                                <span style="display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px;
                                    font-weight: 600; color: white; background: ${getCategoryColor(company.category)};">
                                    ${company.category}
                                </span>
                                <div style="margin-top: 8px;">
                                    <a href="javascript:void(0)" onclick="document.getElementById('map-modal').style.display='none';openDetail(window.__companyRef_${company.name.replace(/[^a-zA-Z0-9]/g, '_')})"
                                    style="color: #2563eb; font-size: 12px; font-weight: 600; text-decoration: none;">
                                        View Details →
                                    </a>
                                </div>
                            </div>
                        `);

                    /* Store reference for popup link */
                    window['__companyRef_' + company.name.replace(/[^a-zA-Z0-9]/g, '_')] = company;

                    marker.addTo(map);
                    dotMarkers.push(marker);
                });
            });
        }

        function addMapLegend() {
            const legend = L.control({ position: 'bottomleft' });
            legend.onAdd = function () {
                const div = L.DomUtil.create('div', 'companies-map-legend');
                div.innerHTML = `
                        <div class="companies-map-legend__title">Industry Legend</div>
                        <div class="companies-map-legend__grid">
                            <div class="companies-map-legend__item"><span style="background:#2563eb"></span>VLSI / Semiconductor</div>
                            <div class="companies-map-legend__item"><span style="background:#10b981"></span>AI / Machine Learning</div>
                            <div class="companies-map-legend__item"><span style="background:#8b5cf6"></span>Software / EDA</div>
                            <div class="companies-map-legend__item"><span style="background:#f59e0b"></span>Hardware / Embedded</div>
                            <div class="companies-map-legend__item"><span style="background:#06b6d4"></span>Cloud</div>
                            <div class="companies-map-legend__item"><span style="background:#ef4444"></span>Cybersecurity</div>
                            <div class="companies-map-legend__item"><span style="background:#eab308"></span>Fintech</div>
                            <div class="companies-map-legend__item"><span style="background:#ec4899"></span>Biotech</div>
                        </div>
                    `;
                return div;
            };
            legend.addTo(map);
        }

        function applyMapFilters() {
            // 1. Update the UI labels
            document.getElementById('map-label').innerText =
                selectedCountries.length ? `Selected (${selectedCountries.length})` : 'Location (All)';
            document.getElementById('map-trigger').classList.toggle('active', selectedCountries.length > 0);

            // 2. Fetch the updated results
            fetchCompanies();

            // 3. Close the modal
            closeMapModal();
        }

        function closeMapModal() {
            // Just restore scrolling and hide the modal. NO fetching here.
            document.body.style.overflow = '';
            document.getElementById('map-modal').style.display = 'none';
        }


        /* ── Admin Upload ── */
        async function uploadCompanies() {
            const file = document.getElementById('excel-file').files[0];
            if (!file) return Swal.fire('Error', 'Select a file', 'error');

            const fd = new FormData();
            fd.append('file', file);
            fd.append('clear_db', 'true');

            try {
                const res = await fetch('/api/admin/upload-companies', { method: 'POST', body: fd });
                const d = await res.json();
                if (d.success) { Swal.fire('Success', d.message, 'success'); fetchCompanies(); }
                else Swal.fire('Error', d.error, 'error');
            } catch (e) { Swal.fire('Error', 'Upload failed', 'error'); }
        }


        init();
    </script>

</body>
